name: Audit patch source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell and JSON
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -Encoding UTF8 manifest.json | ConvertFrom-Json
          $translations = Get-Content -Raw -Encoding UTF8 translations.zh-CN.json | ConvertFrom-Json
          $targetVersion = [string]$manifest.target.version
          if ([string]::IsNullOrWhiteSpace($targetVersion) -or $targetVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Manifest target.version is missing or invalid: $targetVersion"
          }
          if ([string]$translations.targetVersion -cne $targetVersion) {
            throw "Version mismatch: manifest=$targetVersion, translations=$($translations.targetVersion)"
          }
          $patchId = [string]$manifest.patchId
          if ($patchId.IndexOf($targetVersion, [StringComparison]::Ordinal) -lt 0) {
            throw "patchId must contain target version ${targetVersion}: $patchId"
          }

          $entries = @($translations.entries)
          if ($entries.Count -eq 0) { throw 'Translation table is empty.' }
          foreach ($entry in $entries) {
            $id = [string]$entry.id
            if ([string]::IsNullOrWhiteSpace($id)) { throw 'Translation entry id cannot be empty.' }
            $expected = 0
            if (-not [int]::TryParse([string]$entry.expectedOccurrences, [ref]$expected) -or $expected -le 0) {
              throw "expectedOccurrences must be a positive integer: $id"
            }
          }
          $duplicateIds = @($entries | Group-Object -Property id | Where-Object { $_.Count -gt 1 })
          if ($duplicateIds.Count -gt 0) {
            throw "Translation entry ids must be unique: $(($duplicateIds.Name | Sort-Object) -join ', ')"
          }

          foreach ($script in Get-ChildItem scripts -Filter *.ps1 -File) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Refuse bundled upstream application files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $forbidden = @(
            Get-ChildItem -Recurse -File -Force |
              Where-Object {
                $_.Extension -in @('.asar', '.nupkg', '.exe', '.dll', '.node', '.pak', '.map') -or
                $_.FullName -match '[\\/](backups|originals|resources[\\/]app)[\\/]'
              }
          )
          if ($forbidden.Count -gt 0) {
            $forbidden.FullName
            throw 'Forbidden upstream application material is present.'
          }

      - name: Audit license boundaries
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-Licensing.ps1

      - name: Build and inspect source archive
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\New-SourceArchive.ps1 -OutputDirectory "$env:RUNNER_TEMP\source-archive"
